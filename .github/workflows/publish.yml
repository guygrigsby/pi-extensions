name: publish

on:
  push:
    branches: [main]

# One release at a time; a later push waits instead of racing the version bump.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip the bot's own bump commit.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: make test
      - name: Bump changed packages and push
        run: |
          pkgs=$(make -s changed)
          if [ -z "$pkgs" ]; then echo "nothing to release"; exit 0; fi
          make bump
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $pkgs
          git commit -m "bump patch: $(echo $pkgs)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish unpublished versions
        run: make publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
